# ============================================
# Supabase 프로필 설정
# ============================================
# 사용: SPRING_PROFILES_ACTIVE=supabase 환경 변수를 설정한 뒤 실행
#
#   export SPRING_PROFILES_ACTIVE=supabase
#   set -a && source .env && set +a
#   ./gradlew bootRun
#
# .env 에 아래 두 변수 중 하나를 선택해서 설정하세요:
#
#   방법 A — DATABASE_URL 한 줄로 (Supabase 대시보드에서 복사한 Connection String):
#     DATABASE_URL=postgresql://postgres.[project-ref]:[password]@aws-0-[region].pooler.supabase.com:5432/postgres
#
#   방법 B — DB_URL / DB_USERNAME / DB_PASSWORD 개별:
#     DB_URL=jdbc:postgresql://[host]:5432/postgres?sslmode=require
#     DB_USERNAME=postgres.[project-ref]
#     DB_PASSWORD=your_supabase_db_password_here
#
# 이 파일은 application.properties 위에 덮어씁니다(Spring profile 우선순위).
# 로컬 postgres(application.properties)는 전혀 건드리지 않아도 됩니다.

spring.application.name=stockknock

# ============================================
# Database — Supabase
# ============================================
# DATABASE_URL 환경 변수를 JDBC 형식으로 변환한 뒤 DB_URL 에 넣거나,
# DB_URL 을 직접 jdbc: 형식으로 설정하세요.
#
# Spring 은 postgresql:// 스킴을 JDBC 드라이버가 인식하지 못하므로
# .env 에서 DB_URL 을 아래 형식으로 설정해야 합니다:
#   DB_URL=jdbc:postgresql://[host]:5432/postgres?sslmode=require
#   DB_USERNAME=postgres.[project-ref]
#   DB_PASSWORD=your_password
#
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — Supabase는 connection 유휴 끊김이 있으므로 pool 설정 강화
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ============================================
# JPA — Supabase 첫 연결 시 주의사항
# ============================================
# - 테이블이 없는 상태라면 아래를 일시적으로 create 또는 update 로 변경 후 기동,
#   이후 validate 로 되돌리세요.
# - 권장 흐름: Supabase SQL Editor 에서 schema.sql 을 먼저 실행 → validate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ============================================
# Server
# ============================================
server.port=${SERVER_PORT:8080}

# ============================================
# CORS — Supabase 환경에서는 배포 도메인으로 교체
# ============================================
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# ============================================
# 이메일 (로컬과 동일 — 필요 시 오버라이드)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================
# GPT / JWT / 기타 — 로컬과 동일
# ============================================
gpt.api.key=${OPENAI_API_KEY}
gpt.model=${GPT_MODEL:gpt-4o-mini}
jwt.secret=${SKJWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

stock.api.alpha-vantage.key=${ALPHA_VANTAGE_API_KEY:}
stock.api.yahoo-finance.enabled=true
stock.api.twelve-data.key=${TWELVE_DATA_API_KEY:}

youtube.api.key=${YOUTUBE_API_KEY:}

notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}
fastapi.base-url=${FASTAPI_BASE_URL:http://localhost:8000}

# ============================================
# Swagger — Supabase 환경에서도 활성화 유지 (필요 시 false)
# ============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ============================================
# 로깅
# ============================================
logging.level.root=INFO
logging.level.com.sxxm.stockknock=INFO
logging.level.org.springframework.security=WARN
logging.level.com.zaxxer.hikari=DEBUG
